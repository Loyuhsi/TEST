name: Deploy Starforge v3 Cloudflare Pages + Worker + SSE
on:
  push:
    branches: [starforge-v3-exosystems-sse-full-ssd]
    paths: ["unified/**", ".github/workflows/starforge-v3-cloudflare.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SF_READ: ${{ secrets.STARFORGE_READ_TOKEN }}
          SF_WRITE: ${{ secrets.STARFORGE_WRITE_TOKEN }}
          JPL_CONTACT: ${{ secrets.STARFORGE_JPL_CONTACT }}
        run: |
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCOUNT" && -n "$SF_READ" && -n "$SF_WRITE" && -n "$JPL_CONTACT" ]]; then
            if [[ "$SF_READ" == "$SF_WRITE" ]]; then echo "::error::Read and write secrets must be different"; exit 1; fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NOT DEPLOYED. Missing Cloudflare credentials and/or Starforge private keys. Configure GitHub Actions repository secrets (see unified/DEPLOY-v3.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
  deploy-atlas-pages:
    needs: credential-gate
    if: needs.credential-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble public assets only
        run: |
          mkdir -p site-dist/unified site-dist/solar-system site-dist/real-milky-way
          cp unified/index.html unified/offline.html unified/style.css unified/data.js unified/exo-engine.js unified/app.js site-dist/unified/
          cp solar-system/index.html site-dist/solar-system/index.html
          cp real-milky-way/index.html site-dist/real-milky-way/index.html
          cp unified/offline.html site-dist/index.html
          test ! -e site-dist/unified/bridge
      - name: Provision Cloudflare Pages site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create starforge-unified-v3-loyuhsi --production-branch=main || true
          npx --yes wrangler@4 pages deploy site-dist --project-name=starforge-unified-v3-loyuhsi --branch=main
  deploy-secure-worker:
    needs: credential-gate
    if: needs.credential-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test model and 13+ TypingMind MCP tools
        working-directory: unified
        run: npm run check
      - name: Configure actual trusted Cloudflare origin
        run: |
          sed -i 's|https://replace-with-your-trusted-domain.example|https://starforge-unified-v3-loyuhsi.pages.dev|' unified/wrangler.toml
          sed -i 's|starforge-unified-bridge-v2|starforge-unified-bridge-v3|g' unified/wrangler.toml
      - name: Deploy Cloudflare Worker with KV + serialized SSD Durable Object
        working-directory: unified
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Install read, write and JPL User-Agent secrets
        working-directory: unified
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          READ: ${{ secrets.STARFORGE_READ_TOKEN }}
          WRITE: ${{ secrets.STARFORGE_WRITE_TOKEN }}
          JPL: ${{ secrets.STARFORGE_JPL_CONTACT }}
        run: |
          printf '%s' "$READ" | npx --yes wrangler@4 secret put READ_TOKEN --name starforge-unified-bridge-v3
          printf '%s' "$WRITE" | npx --yes wrangler@4 secret put WRITE_TOKEN --name starforge-unified-bridge-v3
          printf '%s' "$JPL" | npx --yes wrangler@4 secret put JPL_CONTACT --name starforge-unified-bridge-v3
  deploy-full-sse:
    needs: credential-gate
    if: needs.credential-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FrunkQ/star-system-generator
          ref: f2459feb3a275ce0f7d5f8ad8115c1231eb6a9dd
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build original unmodified SSE 3.2 GPLv3 physics workbench for Cloudflare
        run: |
          npm ci
          npm install --save-dev --legacy-peer-deps --no-audit @sveltejs/adapter-cloudflare@^7
          cp LICENSE COPYING-GPL-3.0
          sed -i 's|@sveltejs/adapter-auto|@sveltejs/adapter-cloudflare|' svelte.config.js
          CF_PAGES=1 npm run build
      - name: Deploy complete SSE 3.2 application as separate Cloudflare Pages site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create starforge-sse-full-loyuhsi --production-branch=main || true
          npx --yes wrangler@4 pages deploy .svelte-kit/cloudflare --project-name=starforge-sse-full-loyuhsi --branch=main
