name: Starforge v4 validation and optional Cloudflare deployment
on:
  push:
    branches: [starforge-v3-exosystems-sse-full-ssd]
    paths: ["unified/**", ".github/workflows/starforge-v3-cloudflare.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starforge-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check READ, WRITE, ADMIN, sync, provenance and JPL serialization
        working-directory: unified
        run: npm run check
  credential-gate:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCOUNT" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Actions deployment not run: Cloudflare credentials are absent. Cloudflare Git builds are separate; a green validation run is not deployment evidence."
            echo "Deployment jobs skipped. Confirm the Cloudflare Git deployment checks and production health separately." >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy-atlas-pages:
    needs: credential-gate
    if: needs.credential-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build public assets only
        run: node unified/scripts/build-pages.mjs
      - name: Deploy existing mobile Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site-dist --project-name=starforge-unified-v3-loyuhsi --branch=starforge-v3-exosystems-sse-full-ssd
  deploy-secure-worker:
    needs: credential-gate
    if: needs.credential-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      # Runtime secrets are managed in Cloudflare, never copied into GitHub.
      # Wrangler preserves existing secrets and the v1/v2 migration history.
      - name: Deploy existing bridge with its actual KV and SQLite bindings
        working-directory: unified
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Require ready production bindings and credentials
        run: |
          node --input-type=module -e 'const r=await fetch("https://starforge-unified-bridge-v3.loyuhsi930821.workers.dev/api/health");const h=await r.json();if(!r.ok||h.status!=="ok"||![h.kv,h.editing,h.ssd,h.read_configured,h.write_configured,h.admin_configured,h.jpl_configured].every(Boolean))throw Error("Production health is not ready");console.log(JSON.stringify(h));'
  deploy-full-sse:
    needs: credential-gate
    if: needs.credential-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build pinned original SSE with opt-in handoff and GPL source notice
        working-directory: unified
        run: bash scripts/build-sse-cloudflare.sh
      - name: Deploy existing SSE Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy unified/sse-upstream/.svelte-kit/cloudflare --project-name=starforge-sse-full-loyuhsi --branch=starforge-v3-exosystems-sse-full-ssd
