# Starforge v4 bidirectional TypingMind Worker production deployment
# Cloudflare Workers Builds: Git repo Loyuhsi/TEST, production branch starforge-v3-exosystems-sse-full-ssd
# Project root directory: unified; deployment command: npx wrangler deploy
# Requires encrypted READ_TOKEN, WRITE_TOKEN and JPL_CONTACT secrets before private APIs work.
name = "starforge-unified-bridge-v3"
main = "bridge/worker.js"
compatibility_date = "2026-11-21"
workers_dev = true

# Cloudflare Wrangler 4.45+ supports automatic KV provisioning in its open beta.
# If this does not work on your account, create a KV namespace manually
# and add: id = "<your-kv-namespace-id>"
[[kv_namespaces]]
binding = "STARFORGE_KV"

[[durable_objects.bindings]]
name = "SSD_GATE"
class_name = "SSDGate"

# SQLite-backed Durable Objects are required for new classes in 2026.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSDGate"]

# Dedicated transactionally persisted AI edit overlay; preserves previous SSD_GATE
[[durable_objects.bindings]]
name = "EDIT_GATE"
class_name = "EditGate"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EditGate"]

[vars]
# raw.githack.com is convenient for testing ONLY. For production remove it
# and set this to YOUR trusted self-hosted frontend origin.
ALLOWED_ORIGINS = "https://starforge-unified-v3-loyuhsi.pages.dev,https://typingmind.com,https://www.typingmind.com"
